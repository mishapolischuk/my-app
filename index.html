<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфоліо - Поліщук Михайло</title>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh; display: flex; justify-content: center; align-items: center; color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
      padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 15px 25px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2); max-width: 400px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { font-size: 16px; margin-bottom: 20px; opacity: 0.9; line-height: 1.5; }
    .btn {
      display: inline-block; padding: 10px 25px; background: #fff; color: #764ba2;
      text-decoration: none; border-radius: 25px; font-weight: bold; transition: 0.3s;
    }
    .btn:hover { background: #667eea; color: white; }
  </style>
</head>
<body>
<div class="card">
  <h1>👋 Привіт, я Михайло!</h1>
  <p>Це мій перший вебдодаток, успішно розгорнутий на хмарному сервері в рамках лабораторної роботи.</p>
  <p>Технології: HTML5, CSS3, Git, GitHub, Render.</p>
  <a href="https://github.com/" class="btn" target="_blank">Мій GitHub</a>
</div>
</body>
</html>
